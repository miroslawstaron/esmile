<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smile Check</title>
    <style>
        /* Container holding the image and the text */
        .container {
            position: relative;
            width: 100%;
            max-width: 800px; /* Adjust as needed */
            margin: auto;
            overflow: hidden; /* Ensures any overflow is hidden */
            height: 500px; /* Set the desired height to crop the image */
        }

        /* Style for the image */
        .container img {
            width: 100%;
            height: auto;
            object-fit: cover; /* Ensures the image covers the container */
            object-position: top; /* Aligns the image to the top, cropping the bottom */
        }

        /* Centered text */
        .centered {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2em;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="./girl.jpg" alt="Smiling person">
        <div class="centered">Do you have a smile like this?</div>
    </div>
</body>
</html>
