<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smile Check</title>
    <style>
        /* Ensure the body uses the Aptos font */
        body {
            font-family: 'Aptos', sans-serif;
            margin: 0;
        }

        /* Container holding the image and the text */
        .container {
            position: relative;
            width: 100%;
            overflow: hidden;
            height: 100vh; /* Full viewport height */
        }

        /* Style for the image */
        .container img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Ensures the image covers the container */
            object-position: top; /* Aligns the image to the top */
        }

        /* Centered text */
        .centered {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
        }

        /* Main heading style */
        .centered h1 {
            font-size: 2em;
            font-weight: bold;
            margin: 0.5em 0;
        }

        /* Subheading style */
        .centered p {
            font-size: 1.2em;
            margin: 0.5em 0;
        }

        /* Button style */
        .centered a.button {
            display: inline-block;
            padding: 0.8em 1.5em;
            margin-top: 1em;
            font-size: 1em;
            color: white;
            background-color: #007BFF; /* Bootstrap primary blue */
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        /* Button hover effect */
        .centered a.button:hover {
            background-color: #0056b3; /* Darker shade of blue */
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="./girl.jpg" alt="Smiling person">
        <div class="centered">
            <h1>Do you have a smile like this?</h1>
            <p>If not, sign up for our future product here</p>
            <a href="https://docs.google.com/forms/d/e/1FAIpQLSdolg7debXn1aogt13p4N3SMqrHYaxQ0_3fpoP8y_RaMqpZng/viewform?usp=dialog" class="button" target="_blank" rel="noopener noreferrer">Sign Up</a>
        </div>
    </div>
</body>
</html>
